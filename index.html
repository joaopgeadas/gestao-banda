<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão da Banda</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --tx:#1c2430; --mut:#6b7686; --bd:#dfe3e9;
  --pri:#1f4e8c; --pri-tx:#fff; --ok:#1d7a46; --bad:#b3261e; --row:#f0f4fa; --warn:#9a6700;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181f; --card:#1d232c; --tx:#e6eaf0; --mut:#93a0b2; --bd:#2f3744;
         --pri:#5b9be0; --pri-tx:#0e1620; --ok:#5bc58a; --bad:#f08a82; --row:#232b36; --warn:#e3b341; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px;margin:0;padding-top:22px}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}

#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:100%;max-width:380px}
.box h1{margin:0 0 4px;font-size:22px}
.box p{margin:0 0 18px;color:var(--mut)}
.box .f{margin-bottom:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}

header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0 10px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:550}
nav button:hover{background:var(--row)}
nav button.on{background:var(--pri);color:var(--pri-tx)}
@media (max-width:760px){
  header.top h1{flex:1;font-size:16px}
  nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  nav button{white-space:nowrap;padding:8px 10px}
  #quem{display:none}
}
main{padding:16px;max-width:1500px;margin:0 auto}
h2.vt{margin:0 0 12px;font-size:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.bar > div{min-width:110px}
.bar .grow{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.card .k{font-size:13px;color:var(--mut)}
.card .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.wrap{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--row);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clk{cursor:pointer}
tr:hover td{background:var(--row)}
td small{display:block;color:var(--mut)}
.in{color:var(--ok)} .out{color:var(--bad)} .warn{color:var(--warn)}
tfoot td{font-weight:650;background:var(--row)}
.empty{padding:30px;text-align:center;color:var(--mut)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:var(--ok)} .tag.bad{color:var(--bad);border-color:var(--bad)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.sec h3{margin:0 0 12px;font-size:16px}
.sec .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec .head h3{margin:0}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:0;width:min(680px,94vw);max-height:92vh}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .dlg{padding:20px}
dialog h2{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid.g3{grid-template-columns:1fr 1fr 1fr}
.grid .full{grid-column:1/-1}
@media (max-width:620px){.grid,.grid.g3{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .left{margin-right:auto}
.seg{display:flex;gap:0}
.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--bd);padding:8px;cursor:pointer;color:var(--tx);position:relative}
.seg label:first-child{border-radius:8px 0 0 8px}.seg label:last-child{border-radius:0 8px 8px 0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:650}
.foto{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.foto .img{width:96px;height:96px;border-radius:12px;border:1px solid var(--bd);background:var(--row);display:grid;place-items:center;color:var(--mut);font-size:12px;overflow:hidden;text-align:center}
.foto .img img{width:100%;height:100%;object-fit:cover}
.sub{margin-top:18px;border-top:1px solid var(--bd);padding-top:14px}
.sub h3{margin:0 0 8px;font-size:15px}
.sub table{min-width:0}
.prev{background:var(--row);border-radius:8px;padding:10px 12px;margin-top:12px;min-height:42px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw}

/* ---- relatórios ---- */
#relOut .doc{border:1px solid var(--bd);border-radius:8px;overflow:auto}
.doc table.dm{width:100%;font-size:11.5px}
.doc table.dm td.n,.doc table.dm th.n{text-align:right;white-space:nowrap}
.doc table.dm tfoot td{font-weight:700;background:#eee}
.doc .resumo{margin:12px 0 0 auto;width:min(520px,100%)} .doc .resumo td{padding:3px 8px} .doc .resumo td:last-child{text-align:right;white-space:nowrap}
.doc .assin{display:flex;gap:40px;justify-content:flex-end;margin-top:38px}
.doc .assin div{width:230px;text-align:center;border-top:1px solid #000;padding-top:4px;font-size:12px}
.da-grid{display:grid;grid-template-columns:1fr 8px 1fr;align-items:start;margin-top:6px}
.da-grid .bar{background:#000;align-self:stretch}
.da-t{border:1px solid #000;text-align:center;font-weight:700;padding:5px;font-size:15px}
.da-h{border:1px solid #000;text-align:center;font-weight:700;padding:4px;margin-top:-1px}
.da-c{border:1px solid #000;padding:3px 6px;margin-top:-1px}
.da-l{display:flex;border:1px solid #000;margin-top:-1px}
.da-l span{flex:1;padding:3px 6px} .da-l b{min-width:96px;text-align:right;font-weight:400;border-left:1px solid #000;padding:3px 6px}
.da-l.tot{font-weight:700;margin-top:0} .da-l.tot b{font-weight:700}
.da-g{display:grid;grid-template-columns:24% 1fr 96px;border:1px solid #000;margin-top:-1px}
.da-g .gn{display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;border-right:1px solid #000}
.da-g .gs div{padding:3px 6px;font-size:12px} .da-g .gs div + div{border-top:1px solid #000}
.da-g .gv{display:flex;align-items:center;justify-content:flex-end;padding:3px 6px;border-left:1px solid #000}
.doc .tit{border:1px solid #000;text-align:center;font-weight:700;font-size:17px;padding:8px}
.doc .res{width:70%;margin:14px auto 0} .doc .res td{padding:4px 8px} .doc .res td:last-child{text-align:center;width:120px}
.doc .comp td,.doc .comp th{padding:6px 8px;text-align:left} .doc .comp th{width:30%;background:#f3f3f3}

/* ---- impressão ---- */
#printArea{display:none}
.doc{color:#000;background:#fff;font:13px/1.5 Georgia,"Times New Roman",serif;padding:8mm}
.doc h1{font-size:20px;margin:0 0 2px} .doc h2{font-size:17px;margin:14px 0 6px;text-align:center;letter-spacing:.06em}
.doc table{min-width:0;font-size:12px} .doc th,.doc td{border:1px solid #999;padding:4px 6px;background:none;color:#000;position:static}
.doc .cab{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.doc .ass{margin-top:46px;text-align:center;width:260px;border-top:1px solid #000;padding-top:4px;margin-left:auto}
.doc .foto img{width:90px;height:90px;object-fit:cover;border:1px solid #666}
@media print{
  body.printing > :not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body:not(.printing) header.top,body:not(.printing) .bar,body:not(.printing) .acoes,body:not(.printing) .cards{display:none!important}
  body{background:#fff;color:#000} .wrap{border:0;overflow:visible} table{min-width:0;font-size:11px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="box" id="fLogin">
    <h1>Gestão da Banda</h1>
    <p>Entre com o seu e-mail e palavra-passe.</p>
    <div class="f"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="f"><label for="lPass">Palavra-passe</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lErr"></div>
    <button class="btn pri" style="width:100%">Entrar</button>
  </form>
</section>

<!-- APLICAÇÃO -->
<section id="app" hidden>
  <header class="top">
    <h1 id="titulo">Gestão da Banda</h1>
    <nav>
      <button data-v="diario">Diário</button>
      <button data-v="socios">Sócios</button>
      <button data-v="quotas">Quotas</button>
      <button data-v="recibos">Recibos</button>
      <button data-v="relatorios">Relatórios</button>
      <button data-v="config">Dados</button>
    </nav>
    <span id="quem" style="color:var(--mut);font-size:13px"></span>
    <button class="btn sm" id="bSair">Sair</button>
  </header>
  <main>
    <!-- DIÁRIO -->
    <section id="v-diario" hidden>
      <div class="bar">
        <div><label for="fAno">Ano</label><select id="fAno"></select></div>
        <div><label for="fMes">Mês</label><select id="fMes"></select></div>
        <div class="grow"><label for="fTxt">Procurar</label><input id="fTxt" placeholder="descrição, sócio, motivo, atuação…"></div>
        <button class="btn pri" id="bNovo">+ Novo movimento</button>
        <button class="btn" id="bTransf">⇄ Transferência</button>
        <button class="btn" id="bCsv">Exportar CSV</button>
        <button class="btn" id="bPrint">Imprimir</button>
      </div>
      <div class="cards" id="cardsD"></div>
      <div class="wrap"><table id="tabD"></table></div>
    </section>

    <!-- SÓCIOS -->
    <section id="v-socios" hidden>
      <div class="bar">
        <div><label>Estado</label><select id="fSEst"><option value="">Todos</option><option>Ativo</option><option>Inativo</option><option>Suspenso</option></select></div>
        <div><label>Categoria</label><select id="fSCat"></select></div>
        <div class="grow"><label>Procurar</label><input id="fSTxt" placeholder="nome, n.º, NIF, telefone, e-mail…"></div>
        <button class="btn pri" id="bNovoSocio">+ Novo sócio</button>
        <button class="btn" id="bSocCsv">Exportar CSV</button>
        <button class="btn" id="bSocPrint">Imprimir lista</button>
      </div>
      <div class="cards" id="cardsS"></div>
      <div class="wrap"><table id="tabS"></table></div>
    </section>

    <!-- QUOTAS -->
    <section id="v-quotas" hidden>
      <div class="bar">
        <div><label>Ano</label><select id="fQAno"></select></div>
        <div><label>Estado</label><select id="fQEst"><option value="">Todas</option><option>Pendente</option><option value="atraso">Em atraso</option><option>Paga</option></select></div>
        <div class="grow"><label>Procurar sócio / descrição</label><input id="fQTxt"></div>
        <button class="btn pri" id="bEmitir">Emitir quotas</button>
        <button class="btn" id="bAvulsa">+ Quota avulsa</button>
      </div>
      <div class="cards" id="cardsQ"></div>
      <div class="wrap"><table id="tabQ"></table></div>
    </section>

    <!-- RECIBOS -->
    <section id="v-recibos" hidden>
      <div class="bar">
        <div><label>Ano</label><select id="fRAno"></select></div>
        <div class="grow"><label>Procurar</label><input id="fRTxt" placeholder="n.º do recibo ou sócio"></div>
      </div>
      <div class="wrap"><table id="tabR"></table></div>
    </section>

    <!-- RELATÓRIOS -->
    <section id="v-relatorios" hidden>
      <div class="bar">
        <div><label>Relatório</label><select id="rTipo">
          <option value="diario">Diário de tesouraria (mensal)</option>
          <option value="anual">Demonstração de resultados (anual)</option>
          <option value="socios">Demonstração de resultados P/ Sócios</option>
          <option value="motivos">Despesas por motivo e atuação</option></select></div>
        <div><label>Ano</label><select id="rAno"></select></div>
        <div id="rMesBox"><label>Mês</label><select id="rMes"></select></div>
        <button class="btn pri" id="bRelImp">Imprimir</button>
      </div>
      <div id="relOut"></div>
    </section>

    <!-- DADOS DA BANDA -->
    <section id="v-config" hidden>
      <div class="sec">
        <h3>Dados da banda</h3>
        <form id="fCfg">
          <div class="grid">
            <div class="full"><label>Nome da banda</label><input name="nome_banda"></div>
            <div><label>NIF</label><input name="nif"></div>
            <div><label>Telefone</label><input name="telefone"></div>
            <div class="full"><label>Morada</label><input name="morada"></div>
            <div><label>Código postal</label><input name="cod_postal"></div>
            <div><label>Localidade</label><input name="localidade"></div>
            <div class="full"><label>E-mail</label><input name="email" type="email"></div>
            <div><label>Presidente</label><input name="presidente"></div>
            <div><label>Género do cargo de presidente</label><select name="presidente_genero"><option value="">—</option><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
            <div><label>Tesoureiro(a)</label><input name="tesoureiro"></div>
            <div><label>Género do cargo de tesoureiro</label><select name="tesoureiro_genero"><option value="">—</option><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
            <div><label>Prefixo dos recibos</label><input name="prefixo_recibo" maxlength="5"></div>
          </div>
          <div class="acts"><button class="btn pri">Guardar dados da banda</button></div>
        </form>
      </div>
      <div id="listasCfg"></div>
    </section>
  </main>
</section>

<!-- MOVIMENTO -->
<dialog id="dMov">
  <form id="fMov" method="dialog">
    <h2 id="mTit">Novo movimento</h2>
    <div class="grid">
      <div class="full seg">
        <label><input type="radio" name="tipo" value="E" checked><span>Entrada (recebimento)</span></label>
        <label><input type="radio" name="tipo" value="S"><span>Saída (pagamento)</span></label>
      </div>
      <div><label>Data</label><input name="data_mov" type="date" required></div>
      <div><label>Valor (€)</label><input name="valor" inputmode="decimal" placeholder="0,00" required></div>
      <div class="full"><label>Descrição</label><input name="descricao" required maxlength="200"></div>
      <div><label>Conta</label><select name="id_conta" required></select></div>
      <div><label>Categoria</label><select name="id_cat_mov"></select></div>
      <div><label>Meio de pagamento</label><select name="id_meio"></select></div>
      <div><label>Documento / n.º</label><input name="documento" maxlength="40"></div>
      <div><label>Sócio</label><select name="id_socio"></select></div>
      <div><label>ou Terceiro (não sócio)</label><input name="terceiro" maxlength="100"></div>
      <div><label>Motivo (ex.: Alimentação, Transporte)</label><input name="motivo" list="lMotivos" maxlength="100"></div>
      <div><label>Atuação</label><input name="atuacao" list="lAtuacoes" maxlength="150"></div>
      <div class="full"><label>Notas</label><textarea name="notas" rows="2"></textarea></div>
    </div>
    <datalist id="lMotivos"></datalist><datalist id="lAtuacoes"></datalist>
    <div class="err" id="mErr"></div>
    <div class="acts">
      <button type="button" class="btn" data-fechar="dMov">Cancelar</button>
      <button class="btn pri">Guardar</button>
    </div>
  </form>
</dialog>

<!-- TRANSFERÊNCIA -->
<dialog id="dTr">
  <form id="fTr" method="dialog">
    <h2>Transferência entre contas</h2>
    <div class="grid">
      <div><label>Data</label><input name="data_mov" type="date" required></div>
      <div><label>Valor (€)</label><input name="valor" inputmode="decimal" placeholder="0,00" required></div>
      <div><label>De (sai desta conta)</label><select name="de" required></select></div>
      <div><label>Para (entra nesta conta)</label><select name="para" required></select></div>
      <div class="full"><label>Descrição</label><input name="descricao" value="Transferência entre contas" required></div>
    </div>
    <div class="err" id="tErr"></div>
    <div class="acts">
      <button type="button" class="btn" data-fechar="dTr">Cancelar</button>
      <button class="btn pri">Transferir</button>
    </div>
  </form>
</dialog>

<!-- FICHA DO SÓCIO -->
<dialog id="dSocio" class="wide">
  <div class="dlg">
    <h2 id="sTit">Novo sócio</h2>
    <div class="foto" id="sFotoBox">
      <div class="img" id="sImg">sem foto</div>
      <div>
        <input type="file" id="sFile" accept="image/*" hidden>
        <button type="button" class="btn sm" id="bFoto">Escolher foto…</button>
        <button type="button" class="btn sm bad" id="bFotoRem">Remover foto</button>
        <div style="font-size:12px;color:var(--mut);margin-top:4px" id="sFotoNota"></div>
      </div>
    </div>
    <form id="fSocio" method="dialog">
      <div class="grid g3">
        <div><label>N.º de sócio</label><input name="num_socio" inputmode="numeric"></div>
        <div class="full" style="grid-column:span 2"><label>Nome</label><input name="nome" required maxlength="120"></div>
        <div><label>NIF</label><input name="nif" maxlength="15"></div>
        <div><label>Data de nascimento</label><input name="data_nasc" type="date"></div>
        <div><label>Telefone</label><input name="telefone" maxlength="30"></div>
        <div class="full" style="grid-column:1/-1"><label>E-mail</label><input name="email" type="email" maxlength="80"></div>
        <div class="full" style="grid-column:1/-1"><label>Morada</label><input name="morada" maxlength="150"></div>
        <div><label>Código postal</label><input name="cod_postal" maxlength="12"></div>
        <div><label>Localidade</label><input name="localidade" maxlength="60"></div>
        <div><label>Data de admissão</label><input name="data_admissao" type="date"></div>
        <div><label>Categoria</label><select name="id_cat_socio"></select></div>
        <div><label>Estado</label><select name="estado"><option>Ativo</option><option>Inativo</option><option>Suspenso</option></select></div>
        <div><label>Data de saída</label><input name="data_saida" type="date"></div>
        <label class="chk"><input type="checkbox" name="musico"> É músico</label>
        <div><label>Instrumento</label><input name="instrumento" maxlength="40"></div>
        <div><label>Quota personalizada (€)</label><input name="quota_personalizada" inputmode="decimal" placeholder="usar a da categoria"></div>
        <label class="chk"><input type="checkbox" name="rgpd"> Autorização RGPD</label>
        <div class="full" style="grid-column:span 2"><label>Notas</label><textarea name="notas" rows="2"></textarea></div>
      </div>
      <div class="err" id="sErr"></div>
      <div class="acts">
        <button type="button" class="btn bad left" id="bSocApagar">Apagar sócio</button>
        <button type="button" class="btn" id="bSocFicha">Imprimir ficha</button>
        <button type="button" class="btn" data-fechar="dSocio">Fechar</button>
        <button class="btn pri">Guardar</button>
      </div>
    </form>
    <div class="sub" id="sQuotasBox">
      <div class="head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0">Quotas do sócio</h3>
        <span><button type="button" class="btn sm" id="bSocAvulsa">+ Quota avulsa</button>
        <button type="button" class="btn sm pri" id="bSocReceber">Receber selecionadas</button></span>
      </div>
      <div class="wrap"><table id="tabSQ"></table></div>
    </div>
  </div>
</dialog>

<!-- RECEBER QUOTAS -->
<dialog id="dPag">

function parseValor(t) {

function toast(msg) {

function erroPT(e) {

  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem ligação à internet ou ao servidor.";
  if (/violates foreign key/i.test(m)) return "Não é possível apagar: este registo está a ser usado noutros dados.";
  if (/duplicate key/i.test(m)) return "Já existe um registo com este valor.";
  return m;
}
async function lerTudo(tabela, ordenar) {           // lê todas as linhas (o Supabase devolve 1000 de cada vez)
  const out = []; let de = 0;
  for (;;) {
    let q = sb.from(tabela).select("*");
    for (const o of ordenar) q = q.order(o);
    const { data, error } = await q.range(de, de + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
    de += 1000;
  }
  return out;
}
function opts(arr, nomeFn, vazio) {
  return (vazio ? `<option value="">${vazio}</option>` : "") + arr.map(x => `<option value="${x.id}">${esc(nomeFn(x))}</option>`).join("");
}
function csv(nome, cab, linhas) {
  const cel = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const txt = [cab, ...linhas].map(l => l.map(cel).join(";")).join("\r\n");
  const blob = new Blob(["﻿" + txt], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

}

/* valor por extenso (euros e cêntimos) */
const UN = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezasseis","dezassete","dezoito","dezanove"];
const DZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CT = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function ate999(n) {
  if (n === 100) return "cem";
  const c = Math.floor(n / 100), r = n % 100, p = [];
  if (c) p.push(CT[c]);
  if (r) p.push(r < 20 ? UN[r] : DZ[Math.floor(r / 10)] + (r % 10 ? " e " + UN[r % 10] : ""));
  return p.join(" e ");
}
function numExt(n) {
  if (n === 0) return "zero";
  const m = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), r = n % 1000, partes = [];
  if (m) partes.push({ t: m === 1 ? "um milhão" : ate999(m) + " milhões", v: 1e6 });
  if (mil) partes.push({ t: mil === 1 ? "mil" : ate999(mil) + " mil", v: 1000 });
  if (r) partes.push({ t: ate999(r), v: r });
  let out = partes[0].t;
  for (let i = 1; i < partes.length; i++) {
    const ultimo = i === partes.length - 1, v = partes[i].v;
    out += (ultimo && (v < 100 || v % 100 === 0) ? " e " : " ") + partes[i].t;
  }
  return out;
}
function extenso(valor) {
  const eu = Math.floor(valor + 1e-9), ct = Math.round((valor - eu) * 100), p = [];
  if (eu > 0 || ct === 0) p.push(numExt(eu) + (eu === 1 ? " euro" : (eu >= 1e6 && eu % 1e6 === 0 ? " de euros" : " euros")));
  if (ct > 0) p.push(numExt(ct) + (ct === 1 ? " cêntimo" : " cêntimos"));
  const t = p.join(" e ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function nifValido(s) {
  if (!/^\d{9}$/.test(s)) return false;
  let t = 0; for (let i = 0; i < 8; i++) t += Number(s[i]) * (9 - i);
  let c = 11 - (t % 11); if (c >= 10) c = 0;
  return c === Number(s[8]);
}

async function carregar() {
  try {
    const [contas, cats, meios, socios, movs, catsSocio, quotas, recibos, cfg, demoCfg] = await Promise.all([
      lerTudo("conta", ["id"]), lerTudo("categoria_mov", ["nome"]), lerTudo("meio_pagamento", ["id"]),
      lerTudo("socio", ["nome"]), lerTudo("movimento", ["data_mov", "id"]), lerTudo("categoria_socio", ["nome"]),
      lerTudo("quota", ["id"]), lerTudo("recibo", ["id"]), lerTudo("config", ["id"]), lerTudo("demo_cfg", ["id"])
    ]);
    Object.assign(S, { contas, cats, meios, socios, movs, catsSocio, quotas, recibos, demoCfg, cfg: cfg[0] || {} });
    calcularSaldos();
    desenharTudo();
  } catch (e) { toast("Erro ao carregar: " + erroPT(e)); console.error(e); }
}
function calcularSaldos() {
  const acc = {}; S.contas.forEach(c => acc[c.id] = Number(c.saldo_inicial) || 0);
  for (const m of S.movs) {
    acc[m.id_conta] = (acc[m.id_conta] || 0) + (m.tipo === "S" ? -1 : 1) * Number(m.valor);
    m._saldos = { ...acc };
  }
  S.saldoFinal = { ...acc };
}
function dividaDe(idSocio) {
  const q = S.quotas.filter(x => x.id_socio === idSocio && emAtraso(x));
  return { n: q.length, v: q.reduce((a, x) => a + Number(x.valor || 0), 0) };
}

/* ============ DIÁRIO ============ */
function filtradosD() {
  const t = S.txt.trim().toLowerCase();
  return S.movs.filter(m => {
    if (Number(m.data_mov.slice(0, 4)) !== S.ano) return false;
    if (S.mes && Number(m.data_mov.slice(5, 7)) !== S.mes) return false;
    if (!t) return true;
    return [m.descricao, nomeSocio(m.id_socio), m.terceiro, m.motivo, m.atuacao, m.documento, nomeCat(m.id_cat_mov)]
      .some(x => (x || "").toLowerCase().includes(t));
  });
}
function desenharDiario() {
  const anos = anosDe(S.movs.map(m => m.data_mov));
  if (!anos.includes(S.ano)) S.ano = anos[0];
  $("#fAno").innerHTML = anos.map(a => `<option ${a === S.ano ? "selected" : ""}>${a}</option>`).join("");
  $("#fMes").innerHTML = `<option value="0">Todo o ano</option>` + MESES.map((m, i) => `<option value="${i + 1}" ${i + 1 === S.mes ? "selected" : ""}>${m}</option>`).join("");

  $("#cardsD").innerHTML = S.contas.map(c =>
    `<div class="card"><div class="k">Saldo — ${esc(c.nome)}</div><div class="v">${eur(S.saldoFinal[c.id])}</div></div>`).join("")
    + `<div class="card"><div class="k">Saldo total</div><div class="v">${eur(Object.values(S.saldoFinal).reduce((a, b) => a + b, 0))}</div></div>`;

  const rows = filtradosD();
  let tE = 0, tS = 0;

  if (!rows.length) { $("#tabD").innerHTML = cab + `<tbody><tr><td colspan="${9 + S.contas.length}" class="empty">Sem movimentos neste período.</td></tr></tbody>`; return; }
  const corpo = rows.map(m => {
    const v = Number(m.valor), transf = m.id_transf != null, bloqueado = transf || m.id_recibo != null;
    if (!transf) { if (m.tipo === "E") tE += v; else tS += v; }
    const pessoa = nomeSocio(m.id_socio) || m.terceiro || "";
    const ma = [m.motivo, m.atuacao].filter(Boolean).join(" · ");
    return `<tr>
      <td>${esc(m.num_lanc)}</td><td>${dpt(m.data_mov)}</td>
      <td>${esc(m.descricao)}${pessoa ? `<small>${esc(pessoa)}</small>` : ""}</td>
      <td>${esc(nomeCat(m.id_cat_mov))}</td><td>${esc(ma)}</td>

  }).join("");

async function reduzir(file, max = 480) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
}
$("#sFile").addEventListener("change", async e => {

const fEm = $("#fEmitir");
const SUBS = { Semestral: ["1.º semestre", "2.º semestre"], Trimestral: ["1.º trimestre", "2.º trimestre", "3.º trimestre", "4.º trimestre"], Mensal: MESES };
function vencPadrao() {
  const per = fEm.elements.per.value, ano = Number(fEm.elements.ano.value), sub = Number(fEm.elements.sub.value || 1);
  const mi = per === "Anual" ? 1 : per === "Semestral" ? (sub - 1) * 6 + 1 : per === "Trimestral" ? (sub - 1) * 3 + 1 : sub;
  const d = new Date(ano, mi, 0);                    // último dia do primeiro mês do período

/* ---- Diário de tesouraria mensal ---- */
function diarioMensalHTML(ano, mes) {
  const mm = String(mes).padStart(2, "0"), d1 = `${ano}-${mm}-01`;
  const prox = mes === 12 ? `${ano + 1}-01-01` : `${ano}-${String(mes + 1).padStart(2, "0")}-01`;
  const c1 = S.contas[0], idx = id => (c1 && id === c1.id) ? 1 : 2;
  const n1 = nomeCurto(c1 && c1.nome) || "Caixa";
  const n2 = S.contas.length === 2 ? nomeCurto(S.contas[1].nome) : (S.contas.length > 2 ? "Outras contas" : "Banco");
  const ini = [0, 0, 0], rec = [0, 0, 0], pag = [0, 0, 0], tr = [0, 0, 0];
  S.contas.forEach(c => { ini[idx(c.id)] += Number(c.saldo_inicial) || 0; });
  for (const m of S.movs) if (m.data_mov < d1) ini[idx(m.id_conta)] += (m.tipo === "S" ? -1 : 1) * Number(m.valor);
  const doMes = S.movs.filter(m => m.data_mov >= d1 && m.data_mov < prox);
  for (const m of doMes) {
    const i = idx(m.id_conta), v = Number(m.valor);
    if (m.id_transf != null) tr[i] += (m.tipo === "E" ? v : -v);
    else if (m.tipo === "E") rec[i] += v; else pag[i] += v;
  }
  let s1 = ini[1], s2 = ini[2];
  const linhas = doMes.map(m => {
    const i = idx(m.id_conta), v = Number(m.valor), sinal = m.tipo === "E" ? 1 : -1;
    if (i === 1) s1 += sinal * v; else s2 += sinal * v;
    const pessoa = nomeSocio(m.id_socio) || m.terceiro || "";
    const cel = (col, tipo) => (i === col && m.tipo === tipo) ? eur(v) : "";
    return `<tr><td>${esc(m.num_lanc)}</td><td>${dpt(m.data_mov)}</td><td>${esc(m.descricao)}${pessoa ? " — " + esc(pessoa) : ""}</td><td>${esc(nomeCat(m.id_cat_mov))}</td>
      <td class="n">${cel(2, "E")}</td><td class="n">${cel(2, "S")}</td><td class="n">${cel(1, "E")}</td><td class="n">${cel(1, "S")}</td>
      <td class="n">${eur(s1)}</td><td class="n">${eur(s2)}</td></tr>`;
  }).join("");
  const fim1 = ini[1] + rec[1] - pag[1] + tr[1], fim2 = ini[2] + rec[2] - pag[2] + tr[2];
  const dAnt = (() => { const d = new Date(ano, mes - 1, 0); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); })();
  const U = t => esc(t.toUpperCase());
  return `${cabBanda()}
    <h2 style="text-align:left;margin:4px 0 8px">Diário de tesouraria — ${MESES[mes - 1].toLowerCase()} de ${ano}</h2>
    <table class="dm"><thead><tr><th>Nº</th><th>Data</th><th>Descrição</th><th>Categoria</th>
      <th class="n">Entradas ${esc(n2)}</th><th class="n">Saídas ${esc(n2)}</th><th class="n">Entradas ${esc(n1)}</th><th class="n">Saídas ${esc(n1)}</th>
      <th class="n">Saldo ${esc(n1)}</th><th class="n">Saldo ${esc(n2)}</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="10" style="text-align:center">Sem movimentos neste mês.</td></tr>`}</tbody>
    <tfoot><tr><td colspan="4">Totais do mês (sem transferências)</td><td class="n">${eur(rec[2])}</td><td class="n">${eur(pag[2])}</td><td class="n">${eur(rec[1])}</td><td class="n">${eur(pag[1])}</td><td></td><td></td></tr></tfoot></table>
    <table class="resumo">
      <tr><td>SALDO ${U(n2)} RECEBIDO EM ${dAnt}</td><td>${eur(ini[2])}</td></tr>
      <tr><td>SALDO ${U(n1)} RECEBIDO EM ${dAnt}</td><td>${eur(ini[1])}</td></tr>
      <tr><td>Exercício mensal ${U(n2)}</td><td>${eur(rec[2] - pag[2] + tr[2])}</td></tr>
      <tr><td>Exercício mensal ${U(n1)}</td><td>${eur(rec[1] - pag[1] + tr[1])}</td></tr>
      <tr><td>SALDO ACUMULADO ${U(n2)}</td><td>${eur(fim2)}</td></tr>
      <tr><td>SALDO ACUMULADO ${U(n1)}</td><td>${eur(fim1)}</td></tr>
      <tr><td><strong>Saldo Total</strong></td><td><strong>${eur(fim1 + fim2)}</strong></td></tr></table>
    ${assinaturas()}`;
}

/* ---- Demonstração de resultados (rubricas dinâmicas a partir das categorias) ---- */
const cfgDA = (tp, chave, campo) => { const r = S.demoCfg.find(x => x.tipo === tp && x.chave === chave); return r ? (r[campo] || "") : ""; };
function blocosDA(tp, d1, d2) {
  const cats = S.cats.filter(c => c.tipo === tp).sort((a, b) => a.id - b.id);
  const noPeriodo = m => m.data_mov >= d1 && m.data_mov < d2;
  const itens = cats.map(c => ({ nm: c.nome, v: soma(S.movs.filter(m => m.id_cat_mov === c.id && m.tipo === tp && noPeriodo(m)), m => Number(m.valor)) }));
  const extra = soma(S.movs.filter(m => m.id_cat_mov == null && m.tipo === tp && m.id_transf == null && noPeriodo(m)), m => Number(m.valor));
  if (extra !== 0) itens.push({ nm: "Outras (não classificadas)", v: extra });
  itens.forEach(i => { const p = i.nm.indexOf(" - "); i.g = p > 0 ? i.nm.slice(0, p).trim() : i.nm; i.it = p > 0 ? i.nm.slice(p + 3).trim() : i.nm; });
  const blocos = [], feito = new Set(), cabsFeitos = new Set();
  let tot = 0;
  itens.forEach((i, k) => {
    tot += i.v;
    if (feito.has(k)) return;
    const grupo = itens.map((x, j) => ({ x, j })).filter(o => o.x.g === i.g), cnt = grupo.length;
    const chave = cnt > 1 ? i.g : i.nm, cab = cfgDA(tp, chave, "cab_antes");
    if (cab && !cabsFeitos.has(cab)) { cabsFeitos.add(cab); blocos.push({ k: "H", t: cab }); }
    if (cnt > 1) {
      if (cfgDA(tp, i.g, "modo") === "Itens") {
        blocos.push({ k: "C", t: i.g });
        grupo.forEach(o => { blocos.push({ k: "L", t: o.x.it, v: o.x.v }); feito.add(o.j); });
      } else {
        blocos.push({ k: "G", t: i.g, v: soma(grupo, o => o.x.v), subs: grupo.map(o => o.x.it) });
        grupo.forEach(o => feito.add(o.j));
      }
    } else { blocos.push({ k: "L", t: i.nm, v: i.v }); feito.add(k); }
  });
  return { blocos, tot };
}
function colDA(blocos) {
  return blocos.map(b => b.k === "H" ? `<div class="da-h">${esc(b.t)}</div>`
    : b.k === "C" ? `<div class="da-c">${esc(b.t)}</div>`
    : b.k === "L" ? `<div class="da-l"><span>${esc(b.t)}</span><b>${eur(b.v)}</b></div>`
    : `<div class="da-g"><div class="gn">${esc(b.t)}</div><div class="gs">${b.subs.map(t => `<div>${esc(t)}</div>`).join("")}</div><div class="gv">${eur(b.v)}</div></div>`).join("");
}
function saldosAte(ate) {
  let banco = 0, caixa = 0;
  S.contas.forEach((c, i) => {
    let v = Number(c.saldo_inicial) || 0;
    S.movs.forEach(m => { if (m.id_conta === c.id && m.data_mov < ate) v += (m.tipo === "S" ? -1 : 1) * Number(m.valor); });
    if (i === 0) caixa += v; else banco += v;
  });
  return { banco, caixa };
}
function demoHTML(ano, socios) {
  const d1 = `${ano}-01-01`, d2 = `${ano + 1}-01-01`;
  const E = blocosDA("E", d1, d2), D = blocosDA("S", d1, d2);
  const tit = `Demonstração de resultados ${ano}` + (S.cfg.nome_banda ? " - " + S.cfg.nome_banda : "");
  const linhaRes = (t, v, neg) => `<tr><td style="text-align:right">${neg ? "<strong>" + t + "</strong>" : t}</td><td>${neg ? "<strong>" + eur(v) + "</strong>" : eur(v)}</td></tr>`;
  let topo = "", fimSoc = "";
  if (socios) {
    const a = saldosAte(d1), b = saldosAte(d2);
    topo = `<table class="res">${linhaRes("Saldo bancário do ano anterior", a.banco)}${linhaRes("Saldo fundo de maneio do ano anterior", a.caixa)}</table>`;
    fimSoc = linhaRes("Saldo Bancário actual", b.banco) + linhaRes("Saldo fundo de maneio actual", b.caixa) + linhaRes("Saldo total actual", b.banco + b.caixa, true);
  }
  return `<div class="tit">${esc(tit)}</div>${topo}
    <div class="da-grid" style="margin-top:10px">
      <div class="da-t">Receitas</div><i></i><div class="da-t">Despesas</div>
      <div>${colDA(E.blocos)}</div><i class="bar"></i><div>${colDA(D.blocos)}</div>
      <div class="da-l tot"><span>Total</span><b>${eur(E.tot)}</b></div><i></i><div class="da-l tot"><span>Total</span><b>${eur(D.tot)}</b></div>
    </div>
    <div class="tit" style="margin-top:16px;font-size:15px">Resumo do ano</div>
    <table class="res">${linhaRes("Total de Receitas", E.tot)}${linhaRes("Total de Despesas", D.tot)}${linhaRes("Saldo do Exercício", E.tot - D.tot, true)}${fimSoc}</table>
    ${assinaturas()}`;
}

/* ---- Despesas por motivo e por atuação ---- */
function motivosHTML(ano) {
  const rows = S.movs.filter(m => m.tipo === "S" && m.id_transf == null && Number(m.data_mov.slice(0, 4)) === ano);
  const agrupar = campo => {
    const mp = new Map();
    rows.forEach(m => { const k = m[campo] || "(sem " + (campo === "motivo" ? "motivo" : "atuação") + ")"; const o = mp.get(k) || { t: 0, n: 0 }; o.t += Number(m.valor); o.n++; mp.set(k, o); });
    return [...mp.entries()].sort((a, b) => b[1].t - a[1].t);
  };
  const tab = (titulo, lista) => `<h2 style="text-align:left">${titulo}</h2><table class="dm"><thead><tr><th>${titulo.split(" ").pop()}</th><th class="n">Lançamentos</th><th class="n">Total</th></tr></thead><tbody>
    ${lista.map(([k, o]) => `<tr><td>${esc(k)}</td><td class="n">${o.n}</td><td class="n">${eur(o.t)}</td></tr>`).join("") || `<tr><td colspan="3">Sem despesas neste ano.</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${soma(lista, ([, o]) => o.n)}</td><td class="n">${eur(soma(lista, ([, o]) => o.t))}</td></tr></tfoot></table>`;
  const comAt = agrupar("atuacao").filter(([k]) => !k.startsWith("(sem"));
  return `${cabBanda()}<h2 style="text-align:left;margin:4px 0">Despesas de ${ano}</h2>${tab("Despesas por motivo", agrupar("motivo"))}
    ${comAt.length ? tab("Despesas por atuação", comAt) : ""}`;
}

/* ---- Comprovativo de pagamento (saídas) ---- */
function comprovativoHTML(m) {
  const c = S.cfg || {}, benef = m.terceiro || nomeSocio(m.id_socio) || "";
  const lin = (k, v) => `<tr><th>${k}</th><td>${v ? esc(v) : "&nbsp;"}</td></tr>`;
  return `${cabBanda()}
    <h2>COMPROVATIVO DE PAGAMENTO — N.º ${esc(m.num_lanc)}</h2>
    <table class="comp">
      ${lin("Data do pagamento", dpt(m.data_mov))}${lin("Meio de pagamento", nomeMeio(m.id_meio))}${lin("Conta", nomeConta(m.id_conta))}
      ${lin("Beneficiário (quem recebe)", benef)}${lin("NIF do beneficiário", "")}${lin("N.º do documento", m.documento)}
      ${lin("Categoria", nomeCat(m.id_cat_mov))}${lin("Motivo do pagamento", m.motivo)}${lin("Atuação / evento", m.atuacao)}
      ${lin("Descrição / observações", m.descricao + (m.notas ? " — " + m.notas : ""))}
      <tr><th>Valor</th><td><strong>${eur(m.valor)}</strong> (${esc(extenso(Number(m.valor)))})</td></tr></table>
    <p>Declaro que recebi de ${esc(c.nome_banda)} a quantia de ${eur(m.valor)} referente ao pagamento acima indicado.</p>
    <p>${esc(c.localidade || "")}${c.localidade ? ", " : ""}${dpt(m.data_mov)}</p>
    ${assinaturas(`<div>O beneficiário<br>${esc(benef)}</div>`)}`;
}

/* ---- ecrã de relatórios ---- */
function desenharRelatorios() {
  const anos = anosDe(S.movs.map(m => m.data_mov)), selA = $("#rAno"), antA = selA.value;
  selA.innerHTML = anos.map(a => `<option>${a}</option>`).join(""); if (antA) selA.value = antA;
  const selM = $("#rMes"), antM = selM.value;
  selM.innerHTML = MESES.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("");
  selM.value = antM || String(new Date().getMonth() + 1);
  renderRelatorio();
}
let relAtual = { html: "", paisagem: false };
function renderRelatorio() {
  const t = $("#rTipo").value, ano = Number($("#rAno").value), mes = Number($("#rMes").value);
  $("#rMesBox").hidden = t !== "diario";
  const html = t === "diario" ? diarioMensalHTML(ano, mes) : t === "anual" ? demoHTML(ano, false) : t === "socios" ? demoHTML(ano, true) : motivosHTML(ano);
  relAtual = { html, paisagem: t === "diario" };
  $("#relOut").innerHTML = `<div class="doc">${html}</div>`;
}
["rTipo", "rAno", "rMes"].forEach(i => $("#" + i).addEventListener("change", renderRelatorio));
$("#bRelImp").addEventListener("click", () => imprimir(relAtual.html, relAtual.paisagem));

arranque();
</script>
</body>
